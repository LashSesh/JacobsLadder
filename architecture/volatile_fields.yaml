schema: psk.volatile-fields/1.0
# Anhang Listing B.4 (PSK-RA v1.0.6), Definition 6.5 (Volatile Felder und
# Identitaetsprojektion). Woertlich aus dem Dokument uebernommen.
purpose: >
  Abgeschlossene Menge der Felder, die pi_vol vor der Identitaetsbildung
  rekursiv entfernt. Zwei Gruende, ein Mechanismus: volatile Felder sind
  nicht reproduzierbar, non_canonical Felder sind reproduzierbar, aber
  nicht Teil des kanonischen Zustands. Es existiert kein zweiter
  Ausschlusspfad neben diesem Register.
  Objekt-ID = psk:<sorte>:H(Can(pi_vol(o))).
  record_digest = H(Can(o)) ueber das vollstaendige Objekt.
volatile: # nicht reproduzierbar zwischen Laeufen
  - path: "DualTime.tau_e"          # Wanduhr, Invariante Replayneutralitaet
  - path: "DualTime.clock_ref"      # Identitaet/Kalibrierstatus der Uhr
  - path: "DualTime.uncertainty_ns" # deklarierte Messunsicherheit
  - path: "*.runtime_metrics"       # Laufzeitmesswerte
  - path: "*.persona_projection"    # Ausgabeprojektionen, M27
  - path: "*.view_*"                # Beobachtungsprojektionen, M27
non_canonical: # reproduzierbar, aber nicht kanonischer Zustand
  - path: "ThoughtBody.claim.text" # Axiom 7.8 "Gedanke ist kein Satz"
not_removed:
  - path: "DualTime.tau_i" # Kausalzaehler, je run_id deterministisch
enforcement:
  gate_input_forbidden: [volatile, record_digest]
  error_on_violation: PSK-E015
