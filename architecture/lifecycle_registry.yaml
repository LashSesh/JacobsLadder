  - {id: L-EPOCH, duration: "bis Reankrierung", rule: "An genau einen AnchorSnapshot gebunden; verfaellt mit dessen Frische."}
  - {id: L-PERSIST, duration: "unbegrenzt", rule: "Append-only; nur durch Exzisionszertifikat entfernbar."}
  - {id: L-IMMUTABLE, duration: "unbegrenzt", rule: "Inhaltsadressiert, nach Erzeugung unveraenderlich."}
