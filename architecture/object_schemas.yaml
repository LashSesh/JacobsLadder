schema: psk.object-schemas/1.0
# Volle Feldstrukturen der kanonischen Objekte aus PSK-RA v1.0.8, Struktur
# 7.1-7.47 (Kapitel 7) sowie Struktur 21.5 (ValidationPlan, Kapitel 21) und
# Struktur 22.7 (ReplayManifest, Kapitel 22) - diese zwei liegen ausserhalb
# Kapitel 7, definieren aber ebenfalls OBJ-VAL/OBJ-RPM aus object_registry.yaml.
#
# Von den 29 Eintraegen in object_registry.yaml haben 28 eine explizite
# Feldstruktur: die urspruenglichen 25, OBJ-PRJ (FieldProjection,
# nachgetragen in v1.0.3, Fehlerkorrektur Punkt 4; Struktur 7.15, Regel
# 7.16/7.15/7.16), OBJ-RCL (RealityClassification, nachgetragen in
# v1.0.7, Fehlerkorrektur Punkt 10; Struktur 7.11, Regel 7.12) und OBJ-FCT
# (Forecast, nachgetragen in v1.0.22; Struktur 20.11, Regel 20.12). Die
# ersten beiden waren jeweils schon vorher im Objektregister und an einem
# Port gefuehrt, nur ohne Felder; OBJ-FCT fehlte ganz, obwohl der Vertrag
# zur Prognosepersistenz seine vier Pflichtfelder seit je benannte.
# Nur OBJ-VIW (ViewArtifact) bleibt ohne
# Feldstruktur: es traegt seit v1.0.3 explizit canonical:false in
# object_registry.yaml und faellt nach I-ARCH-015 aus der Kanonisierung -
# der Registereintrag dient Ownership und Lebensdauer, nicht der
# Digestbildung, und braucht deshalb kein Schema.
#
# Feldnotation: type ist die im Text genannte Sorte/Referenz (Digest,
# ObjectId, DualTime, ein Enum als "A | B | C", ein Array als "[T]", ein
# Objekt als eigener nested_struct-Verweis). optional=true entspricht
# einem "?" im Quelltext. Kommentare aus dem Quelltext sind als "note"
# uebernommen, nicht ergaenzt.
count: 29

# Struktur 7.27 (Matrix und Scaled), v1.0.8 (Fehlerkorrektur Punkt 12/13):
# "Beide Typen sind intern berechnet, nicht domaenengeliefert, und gehen in
# einen kanonischen Digest ein. Ihre Kodierung MUSS daher festgelegt sein."
# Anders als LensSpec/PredicateExpr/RealityEvidence (Vertrag 27.2) sind das
# KEINE domaenengelieferten opaken Eingaben - die Unterscheidung, die der
# Nutzer nach dem ersten Matrix-Befund gezogen hat: Matrix wird von M10
# SELBST berechnet, DependencyProfile ist memory:canonical, und ohne feste
# Kodierung ergeben zwei Implementierungen fuer denselben Inhalt
# verschiedene Digests - dieselbe Fehlerklasse wie tau_e vor v1.0.5.
#
# shared_structs (anders als nested_structs) werden GENAU EINMAL erzeugt
# und von mehreren Objekten referenziert: Scaled tritt in FieldIdentity,
# DependencyProfile und ValidationPlan.Step auf, Matrix zweimal allein in
# DependencyProfile. Ein nested_struct je Objekt haette denselben Namen
# mehrfach definiert.
shared_structs:
  Scaled:
    - {name: schema, type: "psk.scaled/1.0"}
    - {name: numerator, type: integer}
    - {name: scale, type: integer, note: "Wert = numerator / 10^scale, scale >= 0. Vertrag 6.3 verbietet Gleitkomma ohne exakte Dezimaldarstellung - Scaled ist der einzige nichtganzzahlige Typ des Werkes."}
  Matrix:
    - {name: schema, type: "psk.matrix/1.0"}
    - {name: axis, type: "[SourceRef]", note: "Zeilen- UND Spaltenachse, identisch (Regel 7.28)"}
    - {name: scale, type: integer, note: "gemeinsamer Nenner aller Zellen"}
    - {name: values, type: "[[integer]]", note: "quadratisch, |axis| x |axis|; Zelle (i,j) = values[i][j] / 10^scale"}

objects:
  - id: OBJ-RTM
    name: RuntimeManifest
    struktur: "7.1"
    schema_id: psk.runtime-manifest/1.0
    fields:
      - {name: schema, type: "psk.runtime-manifest/1.0"}
      - {name: constitution_id, type: Digest}
      - {name: architecture_id, type: Digest}
      - {name: implementation_id, type: Digest}
      - {name: profile, type: "ProfileId", note: "readonly | shadow | sandbox | reference"}
      - {name: capability_matrix, type: CapabilityMatrixRef}
      - {name: build_digest, type: Digest}
      - {name: operator_versions, type: "map<OpId,SemVer>"}
      - {name: adapter_versions, type: "map<AdapterId,SemVer>"}
      - {name: determinism_class, type: "R0 | R1 | R2 | R3"}
      - {name: max_depth, type: uint32, note: "Skalentiefe; das Topologieregister verweist
          hierher (Invariante Skalenturm). Nachgetragen in v1.0.32: die Referenz bestand,
          das Feld nicht - haengende Referenz derselben Klasse wie ratchet_max_rounds. Ohne
          es ist descend unimplementierbar und die Wohlgeformtheitsbedingung
          level <= max_depth einer M13Address nicht pruefbar."}

  - id: OBJ-IDB
    name: IdentityBinding
    struktur: "7.2"
    schema_id: psk.identity-binding/1.0
    fields:
      - {name: schema, type: "psk.identity-binding/1.0"}
      - {name: I_C, type: Digest}
      - {name: I_A, type: Digest}
      - {name: I_M, type: Digest}
      - {name: I_t, type: Digest}
      - {name: trace_head, type: Digest}
      - {name: bound_at, type: DualTime}
      - {name: intrinsic_section, type: Digest, note: "aus Typ, Provenienz, Konstitutionsbindung, Trace"}
      - {name: extrinsic_section, type: Digest, note: "aus Verhalten, Claims, Zertifikaten, Aussenrecords"}
      - {name: equalizer_sector, type: EqualizerId, optional: true, note: "Pflicht fuer Identitaetsclosure"}

  - id: OBJ-ANC
    name: AnchorSnapshot
    struktur: "7.4"
    schema_id: psk.anchor-snapshot/1.0
    fields:
      - {name: schema, type: "psk.anchor-snapshot/1.0"}
      - {name: id, type: ObjectId}
      - {name: observations, type: "[Observation]", note: "rohe, unvermischte Aussenrecords"}
      - {name: provenance, type: nested_struct, nested_struct: Provenance}
      - {name: uncertainty, type: nested_struct, nested_struct: AnchorUncertainty}
      - {name: context, type: ContextRef}
      - {name: time, type: DualTime}
      - {name: validity, type: nested_struct, nested_struct: Validity}
      - {name: boundary, type: ScopeExpr, note: "was der Anker NICHT erfasst"}
      - {name: digest, type: Digest}
      - {name: sealed, type: bool, note: "true nach Versiegelung; danach unveraenderlich"}
    nested_structs:
      Provenance:
        - {name: source_adapter, type: AdapterId}
        - {name: observer_identity, type: Digest, note: "MUSS != Effekt-Adapteridentitaet"}
        - {name: method, type: string}
        - {name: input_digests, type: "[Digest]"}
      AnchorUncertainty:
        - {name: model, type: UncertaintyModelId}
        - {name: parameters, type: "map<string,Scalar>"}
      Validity:
        - {name: freshness_predicate, type: PredicateExpr, note: 'z.B. "age_ns < 5e9 and fs_generation == g"'}
        - {name: expires_at_tau_i, type: uint64}

  - id: OBJ-THB
    name: ThoughtBody
    struktur: "7.9"
    schema_id: psk.thought-body/1.0
    fields:
      - {name: schema, type: "psk.thought-body/1.0"}
      - {name: id, type: ObjectId}
      - {name: anchor_refs, type: "[ObjectId]", note: ">= 1, oder explizit unanchored:true"}
      - {name: unanchored, type: bool}
      - {name: claim, type: nested_struct, nested_struct: Claim}
      - {name: models, type: "[ModelRef]", note: "Modellfamilie mit Version und Geltungsbereich"}
      - {name: trajectories, type: "[TrajectoryRef]"}
      - {name: reality_status, type: RealityStatus}
      - {name: facticity, type: FactStatus}
      - {name: witness_refs, type: "[ObjectId]"}
      - {name: uncertainty, type: UncertaintyBlock}
      - {name: consequences, type: "[ConsequenceRef]", note: "Folgenklasse, Reversibilitaet, Reichweite"}
      - {name: validation_plan_ref, type: ObjectId, optional: true}
      - {name: gate_refs, type: "[ObjectId]"}
      - {name: residue_refs, type: "[ObjectId]"}
      - {name: lineage, type: Lineage}
      - {name: trace_ref, type: TraceRef}
    nested_structs:
      Claim:
        - {name: text, type: string, note: "nur Projektion, nicht normativ; geht nicht in Can ein (Axiom 7.10)"}
        - {name: formal, type: ClaimExpr, note: "kanonischer Zustand"}
        - {name: directionality, type: "internal | external"}

  - id: OBJ-RCL
    name: RealityClassification
    struktur: "7.11"
    schema_id: psk.reality-classification/1.0
    note: "Nachgetragen in v1.0.7 (Fehlerkorrektur Punkt 10). Das Objekt war
      schon vorher Exklusivbesitz von M07 und Nutzlast von P09, besass aber
      in keinem Register eine Feldstruktur."
    rules:
      - {id: "Regel 7.12", title: "Klassifikation ist ein eigenes Objekt",
          statement: "M07 DARF NICHT in den ThoughtBody schreiben. Die
            Klassifikation verlaesst M07 ausschliesslich als
            RealityClassification ueber P09. Das Feld reachability traegt die
            fuer das Praedikat imaginary verlangte Unterscheidung: refuted
            setzt bezeugte Nichterreichbarkeit voraus, unexamined fuehrt zu
            UNKNOWN und DARF NICHT zu IMAGINARY. Ein Verfahren ohne
            UNKNOWN-Ausgang ist nicht konform."}
    fields:
      - {name: schema, type: "psk.reality-classification/1.0"}
      - {name: id, type: ObjectId}
      - {name: thought_ref, type: ObjectId, note: "klassifizierter ThoughtBody, unveraendert"}
      - {name: anchor_ref, type: ObjectId, note: "Anker, relativ zu dem klassifiziert wird"}
      - {name: reality_status, type: RealityStatus, note: "genau ein Wert der geschlossenen Menge"}
      - {name: facticity, type: FactStatus, note: "genau ein Wert der geschlossenen Menge"}
      - {name: reachability, type: "witnessed | refuted | unexamined"}
      - {name: evidence_refs, type: "[ObjectId]", note: "Grundlage; leer nur bei UNKNOWN"}
      - {name: method_ref, type: PluginId, optional: true, note: "MethodPlugin, falls verwendet"}
      - {name: residue_refs, type: "[ObjectId]"}
      - {name: trace_ref, type: TraceRef}
      - {name: classified_at, type: DualTime}

  - id: OBJ-FLD
    name: FieldIdentity
    struktur: "7.14"
    schema_id: psk.field-identity/1.0
    fields:
      - {name: schema, type: "psk.field-identity/1.0"}
      - {name: id, type: ObjectId}
      - {name: domain, type: DomainExpr, note: "D_lambda"}
      - {name: lens, type: LensSpec, note: "Pi_lambda: typisierter Projektor"}
      - {name: operators, type: "[OpId]", note: "O_lambda, Teilmenge der ISA"}
      - {name: questions, type: "[QuestionSpec]", note: "Q_lambda"}
      - {name: witness_rules, type: WitnessPolicy, note: "W_lambda"}
      - {name: boundaries, type: BoundarySpec, note: "B_lambda: Ressourcen- und Effektgrenzen"}
      - {name: gates, type: "[GateId]", note: "G_lambda"}
      - {name: time_window, type: TimeWindow, note: "Theta_lambda"}
      - {name: lineage, type: Lineage, note: "Lin_lambda"}
      - {name: lifecycle, type: "PROPOSED | ACTIVE | QUIESCENT | SPLIT_PENDING | MERGE_PENDING | FOLDED | RETIRED | EXCISED"}
      - {name: archetype, type: ArchetypeId, note: "explorer|falsifier|constructor|historian|auditor|integrator"}
      - {name: dependency_profile_ref, type: ObjectId}
      - {name: budget, type: BudgetSpec}
      - {name: rollback, type: RollbackSpec}
      - {name: marginal_gain, type: Scaled, note: "zuletzt gemessener Wert von Delta-G"}

  - id: OBJ-PRJ
    name: FieldProjection
    struktur: "7.15"
    schema_id: psk.field-projection/1.0
    note: "Nachgetragen in v1.0.3 (Fehlerkorrektur Punkt 4). Kein Randfall:
      Eingang der Kernproduktionen ((ThoughtBody, FieldIdentity) => FieldProjection,
      {FieldProjection}_compat => ScopedCognitionGraph), fliesst ueber P13,
      Eingang von M10 und M11. v1.0.6 (Fehlerkorrektur Punkt 7): Feld
      undefined_reason ersatzlos entfallen, Regel 7.16 geteilt - der Fall
      der nicht anwendbaren Linse steht jetzt in Regel 7.17 und erzeugt gar
      keine Projektion."
    rules:
      - {id: "Regel 7.16", title: "Projektion promoviert nicht",
          statement: "Eine FieldProjection ist eine Sicht, kein Fakt. reality_status
            und facticity des Urbildes DARF NICHT durch eine Projektion veraendert
            werden; die Sorten-Port-Matrix verbietet die Relation (S-PRJ, S-RCN)
            vollstaendig."}
      - {id: "Regel 7.17", title: "Nicht anwendbare Linse erzeugt keine Projektion",
          statement: "Ist die Spektrallinse auf die Sortenmenge des Urbildes nicht
            anwendbar, so entsteht DARF NICHT eine FieldProjection. Statt dessen
            MUSS M09 einen ResidueRecord des Typs scope erzeugen und PSK-E013
            emittieren; dies ist die in Vertrag C5 verlangte Form. Eine
            FieldProjection mit leerem visible ist unzulaessig: Es gibt keine
            leere Projektion, sondern nur eine ausgebliebene."}
      - {id: "Regel 7.18", title: "Occlusion ist explizit",
          statement: "occluded MUSS vollstaendig gefuehrt werden. Was eine Linse
            nicht aufloest, ist ein bezeugter Nichtbefund und DARF NICHT als
            Abwesenheit gewertet werden; andernfalls greift PSK-E005."}
    fields:
      - {name: schema, type: "psk.field-projection/1.0"}
      - {name: id, type: ObjectId}
      - {name: field_ref, type: ObjectId, note: "FieldIdentity, deren Linse angewandt wurde"}
      - {name: source_refs, type: "[ObjectId]", note: "ThoughtBody bzw. IR-Knoten des Urbildes"}
      - {name: lens_ref, type: LensSpec, note: "Pi_lambda, wie zum Zeitpunkt der Anwendung gebunden"}
      - {name: scope, type: ScopeSpec, note: "Geltungsbereich; erweitert sich nie ohne Gate"}
      - {name: visible, type: "[IRNodeId]", note: "was die Linse aufloest; nie leer (Regel 7.17)"}
      - {name: occluded, type: "[IRNodeId]", note: "was sie nachweislich nicht aufloest"}
      - {name: distinctions, type: "[DistinctionSpec]", note: "intern erzeugte Unterscheidungen"}
      - {name: source_provenance, type: "[SourceRef]", note: "Grundlage des Abhaengigkeitsquotienten (M10); v1.0.8 (Fehlerkorrektur Punkt 14) auf SourceRef vereinheitlicht - SourceId existiert nicht mehr"}
      - {name: reality_view, type: RealityStatus, note: "Sicht, nicht Promotion"}
      - {name: tick, type: TickId, note: "L-TICK: gilt genau fuer diesen Takt"}

  - id: OBJ-IRB
    name: IRBundle
    struktur: "7.21"
    schema_id: psk.ir/1.0
    fields:
      - {name: schema, type: "psk.ir/1.0"}
      - {name: version, type: SemVer, note: v}
      - {name: constitution_id, type: Digest, note: N_C}
      - {name: anchor_refs, type: "[ObjectId]", note: A}
      - {name: graph, type: nested_struct, nested_struct: Graph, note: G}
      - {name: field_projections, type: "[ObjectId]", note: F}
      - {name: dependencies, type: ObjectId, note: "D -> DependencyProfile"}
      - {name: witnesses, type: "[ObjectId]", note: W}
      - {name: residues, type: "[ObjectId]", note: R}
      - {name: gate_reports, type: "[ObjectId]", note: Q}
      - {name: trace_ref, type: TraceRef, note: T}
      - {name: capabilities, type: "[CapabilityRef]", note: C}
      - {name: effect_contracts, type: "[EffectContract]", note: E}
      - {name: emission_class, type: "EXECUTABLE | RESIDUAL | QUARANTINED | HOLD"}
      - {name: digest, type: Digest}
    nested_structs:
      Graph:
        - {name: nodes, type: "[IRNode]"}
        - {name: edges, type: "[IREdge]"}

  - id: OBJ-IRN
    name: IRNode
    struktur: "7.22"
    fields:
      - {name: id, type: ObjectId}
      - {name: sort, type: SortId, note: "genau eine Primaersorte"}
      - {name: context, type: ContextRef}
      - {name: lineage, type: Lineage}
      - {name: reality_status, type: RealityStatus}
      - {name: facticity, type: FactStatus}
      - {name: anchor_refs, type: "[ObjectId]"}
      - {name: witness_refs, type: "[ObjectId]"}
      - {name: residue_refs, type: "[ObjectId]"}
      - {name: trace_ref, type: TraceRef}
      - {name: payload_digest, type: Digest}
      - {name: m13_address, type: M13Address, note: "Pflicht nach Pass C4"}

  - id: OBJ-IRE
    name: IREdge
    struktur: "7.22"
    fields:
      - {name: id, type: ObjectId}
      - {name: source, type: ObjectId}
      - {name: target, type: ObjectId}
      - {name: relation_sort, type: RelationSortId}
      - {name: direction, type: "forward | backward | bidirectional_declared"}
      - {name: preconditions, type: "[PredicateExpr]"}
      - {name: postconditions, type: "[PredicateExpr]"}
      - {name: gate_ref, type: ObjectId, optional: true}
      - {name: dependency_refs, type: "[ObjectId]"}
      - {name: trace_ref, type: TraceRef}

  - id: OBJ-CAP
    name: CandidateCapsule
    struktur: "7.23"
    schema_id: psk.candidate-capsule/1.0
    fields:
      - {name: schema, type: "psk.candidate-capsule/1.0"}
      - {name: id, type: ObjectId}
      - {name: surface, type: SurfaceDescriptor, note: "S: beobachtbare Rolle, Name, Behauptung"}
      - {name: invariant_core, type: "[InvariantId]", note: "I: gepruefte, nicht behauptete Invarianten"}
      - {name: phase, type: "SEALED | PERTURBED | RATCHETED | SUPPORTED | CRYSTALLIZED | RESIDUAL | QUARANTINED"}
      - {name: witnesses, type: "[ObjectId]", note: W}
      - {name: replay, type: ReplayDescriptor, note: R}
      - {name: boundary, type: ScopeExpr, note: B}
      - {name: trace_ref, type: TraceRef, note: T}
      - {name: coupling, type: "[ObjectId]", note: "C: Aussenkopplungen"}
      - {name: allowed_next, type: "[CapsuleId]", note: "Ratchet-Restmenge, monoton fallend"}
      - {name: status, type: "OPEN | CLOSED"}

  - id: OBJ-EVD
    name: EvidenceObject
    struktur: "7.25"
    schema_id: psk.evidence/1.0
    fields:
      - {name: schema, type: "psk.evidence/1.0"}
      - {name: id, type: ObjectId}
      - {name: type, type: "measurement | derivation | attestation | external_record | counterexample"}
      - {name: scope, type: ScopeExpr}
      - {name: input, type: "[Digest]"}
      - {name: output, type: Digest}
      - {name: method, type: MethodRef}
      - {name: trace_ref, type: TraceRef}
      - {name: hash, type: Digest}
      - {name: signature, type: Signature, optional: true}
      - {name: status, type: "VALID | INVALID | OCCLUDED | EXPIRED"}
      - {name: independence_class, type: ClassId, note: "aus DependencyProfile abgeleitet"}

  - id: OBJ-DEP
    name: DependencyProfile
    struktur: "7.26"
    schema_id: psk.dependency-profile/1.0
    fields:
      - {name: schema, type: "psk.dependency-profile/1.0"}
      - {name: id, type: ObjectId}
      - {name: sources, type: "[SourceRef]", note: "Daten, Modell, Prompt, Sonde, Kalibrierung"}
      - {name: witness_matrix, type: Matrix, note: W}
      - {name: dependency_matrix, type: Matrix, note: D}
      - {name: effective_rank, type: Scaled, note: "r_eff = RankEff(W, D)"}
      - {name: method, type: RankMethodId, note: "deklarierte Schaetzmethode"}
      - {name: quotient_classes, type: "[[ObjectId]]", note: "F / ~_D"}
      - {name: consensus_scope, type: "local | cluster | system | external"}

  - id: OBJ-SEA
    name: SeamReport
    struktur: "7.30"
    fields:
      - {name: id, type: ObjectId}
      - {name: overlap, type: "[ObjectId, ObjectId]"}
      - {name: restriction_digest_a, type: Digest}
      - {name: restriction_digest_b, type: Digest}
      - {name: compatible, type: bool}
      - {name: tolerance_class, type: "exact | declared_equivalence"}
      - {name: cell_refs, type: "[M13Address]"}

  - id: OBJ-OBS
    name: ObstructionRecord
    struktur: "7.30"
    fields:
      - {name: id, type: ObjectId}
      - {name: kind, type: "seam | order | identity | time | resource | capability | calibration"}
      - {name: located_at, type: "[M13Address]"}
      - {name: involved, type: "[ObjectId]"}
      - {name: severity, type: "blocking | non_blocking"}
      - {name: residue_ref, type: ObjectId}
      - {name: allowed_recovery, type: "[RecoveryPathId]"}

  - id: OBJ-GAT
    name: GateReport
    struktur: "7.32"
    schema_id: psk.gate-report/1.0
    fields:
      - {name: schema, type: "psk.gate-report/1.0"}
      - {name: id, type: ObjectId}
      - {name: gate_id, type: GateId}
      - {name: order, type: "1 | 2", note: "Gate erster oder zweiter Ordnung"}
      - {name: input_digests, type: "[Digest]"}
      - {name: decision, type: "PASS | HOLD | FAIL"}
      - {name: reasons, type: "[ReasonCode]", note: "nicht leer bei HOLD oder FAIL"}
      - {name: evidence_refs, type: "[ObjectId]"}
      - {name: residue_refs, type: "[ObjectId]"}
      - {name: seam_report_refs, type: "[ObjectId]", note: "Pflicht bei order = 2"}
      - {name: replay_descriptor, type: ReplayDescriptor}
      - {name: decided_at, type: DualTime}
      - {name: trace_ref, type: TraceRef}

  - id: OBJ-TOK
    name: EffectToken
    struktur: "7.33"
    schema_id: psk.effect-token/1.0
    fields:
      - {name: schema, type: "psk.effect-token/1.0"}
      - {name: id, type: ObjectId}
      - {name: subject, type: ModuleId, note: "ausschliesslich M16"}
      - {name: effect_class, type: EffectClassId}
      - {name: plan_digest, type: Digest, note: "bindet genau einen EffectPlan"}
      - {name: scope, type: ScopeExpr, note: "Pfad-, Ressourcen- und Reichweitengrenze"}
      - {name: capabilities, type: "[CapabilityId]"}
      - {name: preconditions, type: "[PredicateExpr]"}
      - {name: budget, type: BudgetSpec}
      - {name: expires_at_tau_i, type: uint64}
      - {name: idempotency_key, type: string}
      - {name: nonce, type: bytes32}
      - {name: issuer_digest, type: Digest, note: "I_M von M15"}
      - {name: expected_receipt, type: ReceiptSpec, note: "welcher Record erwartet wird"}
      - {name: rollback, type: "RollbackSpec | NO_ROLLBACK_JUSTIFIED"}
      - {name: gate_report_ref, type: ObjectId}

  - id: OBJ-ATT
    name: EffectAttempt
    struktur: "7.35"
    fields:
      - {name: id, type: ObjectId}
      - {name: token_ref, type: ObjectId}
      - {name: adapter, type: AdapterId}
      - {name: prestate_digest, type: Digest}
      - {name: plan_digest, type: Digest}
      - {name: started_at, type: DualTime}
      - {name: ended_at, type: DualTime, optional: true}
      - {name: outcome, type: "COMPLETED | PARTIAL | FAILED | UNKNOWN_EFFECT"}
      - {name: error, type: ErrorCode, optional: true}
      - {name: compensation_ref, type: ObjectId, optional: true}

  - id: OBJ-RCP
    name: ExternalReceipt
    struktur: "7.35"
    fields:
      - {name: id, type: ObjectId}
      - {name: observer_adapter, type: AdapterId, note: "MUSS != EffectAttempt.adapter"}
      - {name: observer_identity, type: Digest}
      - {name: observed_at, type: DualTime}
      - {name: record, type: bytes, note: "unveraendert, unvermischt"}
      - {name: provenance, type: ProvenanceBlock}
      - {name: result_digest, type: Digest}
      - {name: independence_attestation, type: Digest}

  - id: OBJ-RCN
    name: ReconciliationReport
    struktur: "7.37"
    schema_id: psk.reconciliation/1.0
    fields:
      - {name: schema, type: "psk.reconciliation/1.0"}
      - {name: id, type: ObjectId}
      - {name: plan_ref, type: ObjectId}
      - {name: attempt_ref, type: ObjectId}
      - {name: receipt_refs, type: "[ObjectId]", note: ">= 1"}
      - {name: anchor_ref, type: ObjectId, note: Nachanker}
      - {name: difference, type: DiffTree, note: "Plan-Ist-Differenz, strukturiert"}
      - {name: verdict, type: "CLOSED | OPEN | DIVERGENT | UNKNOWN"}
      - {name: finality, type: "final | provisional | revocable"}
      - {name: fact_promotion, type: "NONE | OBSERVED | ACTUALIZED"}
      - {name: residue_refs, type: "[ObjectId]"}
      - {name: witness_ref, type: ObjectId, note: "ActualizationWitness bei ACTUALIZED"}

  - id: OBJ-RVP
    name: RevisionProposal
    struktur: "12.12"
    schema_id: psk.revision-proposal/1.0
    note: "Nachgetragen in v1.0.29 (Fehlerkorrektur Punkt 31): war Nutzlast von
      P36, Ausgabe der ISA-Instruktion PROPOSE_REVISION und Gegenstand von
      G-SELF-COMPILE, besass aber keine Feldstruktur - dieselbe Lueckenklasse
      wie zuvor ReanchorRequest und Forecast."
    rules:
      - {id: "Regel 12.13", title: "Vorschlag ist kein Vollzug",
          statement: "Ein RevisionProposal ist ein Vorschlag und DARF NICHT eine
            Aenderung. Er entsteht ueber P36 als Rueckfluss: neues Objekt, neue
            Identitaet, Verweis auf den Ursprung. hardening_class MUSS genau
            eine der sechs in Regel Zulaessige Selbstverhaertung genannten
            Klassen tragen; ein Vorschlag ausserhalb dieser Klassen ist
            unzulaessig und erzeugt PSK-E012. cra_inputs_absent MUSS gefuehrt
            werden: ein CRA ueber weniger als alle sechs Eingaben ist
            zulaessig, aber der Vorschlag DARF NICHT den Eindruck erwecken,
            ueber mehr verdichtet zu haben, als vorlag - dieselbe
            Ehrlichkeitspflicht wie beim abgeleiteten Deckungsvektor."}
    fields:
      - {name: schema, type: "psk.revision-proposal/1.0"}
      - {name: id, type: ObjectId}
      - {name: candidate_id, type: ObjectId, note: "MUSS != aktive Instanz, sonst PSK-E012"}
      - {name: hardening_class, type: "tests_and_falsifiers | gate_and_validation_policies |
          replay_and_residue_patterns | dependency_models | search_and_branch_strategies |
          calibration_profiles", note: "genau eine der sechs aus Regel Zulaessige Selbstverhaertung"}
      - {name: source_residues, type: "[ObjectId]", note: "ISA-Eingabe Residues, nichtleer"}
      - {name: source_evidence, type: "[ObjectId]", note: "ISA-Eingabe Evidence, nichtleer"}
      - {name: cra_inputs_present, type: "[CRAInputId]", note: "welche der sechs CRA-Eingaben real vorlagen"}
      - {name: cra_inputs_absent, type: "[CRAInputId]", note: "die uebrigen, benannt statt verschwiegen"}
      - {name: proposed_delta, type: DeltaSpec, note: "was sich aendert, nie eine In-place-Weisung"}
      - {name: parent_binding, type: nested_struct, nested_struct: ParentBinding,
          note: "ParentBound gegen die laufende Instanz"}
      - {name: isolation_build_ref, type: ObjectId, optional: true, note: "Ergebnis des getrennten Prozessbaus"}
      - {name: trace_ref, type: TraceRef, note: "KEIN gate_report_ref (v1.0.30, Regel Urteil
          verweist, Gegenstand nicht): das Urteil verweist auf seinen Gegenstand ueber
          input_digests, nicht umgekehrt - ein nachtraeglich gesetztes Feld waere eine
          Mutation gegen Kein In-place-Rueckfluss"}
    nested_structs:
      ParentBinding:
        - {name: constitution, type: Digest}
        - {name: architecture, type: Digest}
        - {name: implementation, type: Digest}

  - id: OBJ-FCT
    name: Forecast
    struktur: "20.11"
    schema_id: psk.forecast/1.0
    note: "Nachgetragen in v1.0.22. Vertrag Prognosepersistenz verlangte
      seit je Horizont, Erzeugungsbasis, Gueltigkeitsfenster und den
      damaligen Anker - ohne dass ein Objekt diese Felder getragen haette."
    rules:
      - {id: "Regel 20.12", title: "Prognosen werden bewertet, nicht umgeschrieben",
          statement: "horizon, generation_basis, validity_window und
            anchor_ref sind nach Erzeugung unveraenderlich. Eine spaetere
            Beobachtung erzeugt ausschliesslich einen neuen Eintrag in
            evaluations; sie DARF NICHT ein bestehendes Feld aendern und
            DARF NICHT einen bestehenden Eintrag ersetzen. Die
            Durchsetzung erfolgt strukturell: evaluations ist append-only
            wie der Trace, und die uebrigen Felder besitzen keinen
            Schreibpfad nach Konstruktion."}
    fields:
      - {name: schema, type: "psk.forecast/1.0"}
      - {name: id, type: ObjectId}
      - {name: horizon, type: HorizonSpec, note: "bis wohin die Prognose reicht"}
      - {name: generation_basis, type: "[ObjectId]", note: "Erzeugungsbasis, versiegelt"}
      - {name: validity_window, type: TimeWindow, note: "Gueltigkeitsfenster, tau_i-gebunden"}
      - {name: anchor_ref, type: ObjectId, note: "der Anker ZUM ZEITPUNKT der Erzeugung"}
      - {name: claim_refs, type: "[ObjectId]"}
      - {name: evaluations, type: "[ForecastEvaluation]", note: "append-only, nie ersetzend"}
      - {name: trace_ref, type: TraceRef}
    nested_structs:
      ForecastEvaluation:
        - {name: observed_ref, type: ObjectId, note: "spaetere Beobachtung"}
        - {name: verdict, type: "CONFIRMED | REFUTED | INCONCLUSIVE"}
        - {name: evaluated_at, type: DualTime}

  - id: OBJ-TRC
    name: TraceSegment
    struktur: "7.40"
    schema_id: psk.trace-segment/1.0
    rules:
      - {id: "Regel 7.41", title: "Zwei Digests je Segment",
          statement: "segment_digest ist identitaetsbildend: es bildet die
            Hashkette, geht ueber L_t in I_t ein und MUSS daher pi_vol
            anwenden. Andernfalls ginge tau_e entgegen der blockierenden
            Invariante Replayneutralitaet der Wanduhr in einen Digest ein,
            und zwei inhaltsgleiche Laeufe erhielten verschiedene
            Zustandsdigests - R2 waere strukturell unerreichbar und damit
            kein Referenzrelease moeglich. segment_record_digest deckt
            dieselben Felder einschliesslich tau_e ab und sichert die
            Integritaet der gespeicherten Bytes. Es ist DARF NICHT Teil der
            Kette, DARF NICHT Eingabe von I_t und DARF NICHT Eingabe einer
            Gate-Entscheidung. verify_chain MUSS beides pruefen: die
            Kettenfortschreibung ueber segment_digest und je Segment die
            Aufzeichnungsintegritaet ueber segment_record_digest."}
    fields:
      - {name: schema, type: "psk.trace-segment/1.0"}
      - {name: seq, type: uint64, note: "global monoton je run_id"}
      - {name: prev_digest, type: Digest, note: 'Hash-Kette; Genesis = 64x"0"'}
      - {name: event_type, type: EventTypeId}
      - {name: module, type: ModuleId}
      - {name: port_id, type: PortId, optional: true}
      - {name: object_refs, type: "[ObjectId]"}
      - {name: payload_digest, type: Digest}
      - {name: time, type: DualTime}
      - {name: attestation, type: Signature, optional: true}
      - {name: segment_digest, type: Digest, note: "H(Can(pi_vol(alle vorstehenden Felder)))"}
      - {name: segment_record_digest, type: Digest, note: "H(Can(alle vorstehenden Felder)), mit tau_e"}

  - id: OBJ-RES
    name: ResidueRecord
    struktur: "7.43"
    schema_id: psk.residue/1.0
    fields:
      - {name: schema, type: "psk.residue/1.0"}
      - {name: id, type: ObjectId}
      - {name: type, type: "type | anchor | witness | seam | dependency | scope | capability | effect | reconciliation | replay | budget | morphogenesis | horizon"}
      - {name: origin_module, type: ModuleId}
      - {name: origin_object, type: ObjectId}
      - {name: scope, type: ScopeExpr}
      - {name: severity, type: "blocking | non_blocking"}
      - {name: open_obligation, type: ObligationExpr}
      - {name: allowed_followups, type: "[OperationId]"}
      - {name: opened_at, type: DualTime}
      - {name: closed_by, type: ObjectId, optional: true, note: "nur durch expliziten Closure-Operator"}
      - {name: state, type: "OPEN | HELD | QUARANTINED | RECANONICALIZED | CLOSED | EXCISED"}

  - id: OBJ-RUN
    name: RunDescriptor
    struktur: "7.45"
    schema_id: psk.run-descriptor/1.0
    fields:
      - {name: schema, type: "psk.run-descriptor/1.0"}
      - {name: run_id, type: RunId}
      - {name: I_C, type: Digest}
      - {name: I_A, type: Digest}
      - {name: I_M, type: Digest}
      - {name: seed, type: bytes32, note: "Wurzel aller Pseudozufallsstroeme"}
      - {name: versions, type: "map<ComponentId,SemVer>"}
      - {name: input_digests, type: "[Digest]", note: "versiegelte Eingaben"}
      - {name: operators, type: "[OpId]"}
      - {name: environment, type: EnvironmentProfile, note: "deklarierte, replayrelevante Umgebung"}
      - {name: time_window, type: TimeWindow, note: "gebundene Zeitgrenzen fuer Entscheidungen"}
      - {name: nondeterminism_budget, type: NDBudget, note: "zulaessige, deklarierte Abweichungsquellen"}
      - {name: ratchet_max_rounds, type: uint32, note: "Regel 12.7 (Selektionsdruck), Ratchet-Terminierung, nachgetragen
          in v1.0.26: die Regel verortete das Budget woertlich 'im RunDescriptor', das Feld fehlte -
          haengende Referenz derselben Klasse wie seinerzeit T-M13-001. Deklariert, nicht geraten;
          eine Ressourcenentscheidung ueber den Lauf, nicht ueber die Domaene."}
      - {name: canon, type: CanonicalizationProfile}
      - {name: digest, type: Digest}

  - id: OBJ-EXC
    name: ExcisionCertificate
    struktur: "7.47"
    schema_id: psk.excision/1.0
    fields:
      - {name: schema, type: "psk.excision/1.0"}
      - {name: id, type: ObjectId}
      - {name: region, type: "[ObjectId]", note: "A: entfernte Pfade oder Typen"}
      - {name: boundary, type: ScopeExpr, note: dA}
      - {name: reconnect_projection, type: MapExpr, note: "pi_A: Neuroutung der Anschluesse"}
      - {name: preservation_witness, type: "[ObjectId]", note: "W_A: erhaltene Invarianten"}
      - {name: difference, type: DiffTree, note: Delta_A}
      - {name: residues, type: "[ObjectId]"}
      - {name: identity_effect, type: "UNCHANGED | DECLARED_SUCCESSOR"}
      - {name: successor_id, type: Digest, optional: true, note: "Pflicht bei DECLARED_SUCCESSOR"}
      - {name: trace_ref, type: TraceRef}

  - id: OBJ-CRT
    name: MachineCertificate
    struktur: "7.49"
    schema_id: psk.machine-certificate/1.0
    fields:
      - {name: schema, type: "psk.machine-certificate/1.0"}
      - {name: I_C, type: Digest}
      - {name: I_A, type: Digest}
      - {name: I_M, type: Digest}
      - {name: I_t, type: Digest}
      - {name: conformance_class, type: "C0 | C1 | C2 | C3 | C4 | C5"}
      - {name: feature_coverage, type: "[FeatureCoverageId]", note: "abgeleiteter
          Deckungsvektor FC = (FC0, ..., FC8), Regel 23.1. Quelltextnotation ist
          '[FC0..FC8]' - ein Bereich, kein Bezeichner; als Bezeichner gelesen
          erzeugte er einen Vektor beliebiger Laenge ueber freien Zeichenketten."}
      - {name: replay_class, type: "R0 | R1 | R2 | R3"}
      - {name: gate_report_digest, type: Digest}
      - {name: trace_head, type: Digest}
      - {name: replay_manifest_digest, type: Digest}
      - {name: residue_report_digest, type: Digest}
      - {name: capability_audit_digest, type: Digest}
      - {name: negative_test_report_digest, type: Digest}
      - {name: scope, type: ScopeExpr, note: "explizit, nicht universell"}
      - {name: issued_at, type: DualTime}
      - {name: signature, type: Signature}

  - id: OBJ-VAL
    name: ValidationPlan
    struktur: "21.5"
    fields:
      - {name: id, type: ObjectId}
      - {name: target_refs, type: "[ObjectId]"}
      - {name: open_obligations, type: "[ObligationExpr]"}
      - {name: steps, type: "[Step]", nested_struct: Step}
      - {name: ordering, type: ValidationOrderingId, note: "Struktur 21.5 nennt
          genau einen zulaessigen Wert; deterministisch, stabil sortiert"}
      - {name: stop_condition, type: "obligations_closed | budget_exhausted | no_positive_gain"}
    nested_structs:
      Step:
        - {name: probe, type: ProbeSpec}
        - {name: expected_information_gain, type: Scaled}
        - {name: cost, type: BudgetSpec}
        - {name: capability, type: CapabilityId, optional: true}
        - {name: read_only, type: bool}

  - id: OBJ-RPM
    name: ReplayManifest
    struktur: "22.7"
    fields:
      - {name: run_id, type: RunId}
      - {name: run_descriptor_digest, type: Digest}
      - {name: input_digests, type: "[Digest]"}
      - {name: external_records, type: "[ExternalRecordRef]", nested_struct: ExternalRecordRef}
      - {name: trace_head, type: Digest}
      - {name: final_canonical_digest, type: Digest}
      - {name: gate_sequence_digest, type: Digest}
      - {name: achieved_class, type: "R0 | R1 | R2 | R3"}
      - {name: divergences, type: "[DivergenceRecord]"}
    nested_structs:
      ExternalRecordRef:
        - {name: receipt_id, type: string}
        - {name: digest, type: Digest}
        - {name: observer_identity, type: Digest}

not_field_specified:
  - {id: OBJ-VIW, name: ViewArtifact, reason: "traegt seit v1.0.3 explizit canonical:false in
      object_registry.yaml (Fehlerkorrektur v1.0.3, Punkt 5). Speicherklasse none, faellt nach
      I-ARCH-015 aus der Kanonisierung heraus; der Registereintrag dient Ownership und
      Lebensdauer, nicht der Digestbildung - deshalb kein Schema, keine Feldstruktur noetig."}
