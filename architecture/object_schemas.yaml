  - id: OBJ-DEP
    name: DependencyProfile
    struktur: "7.21"
    schema_id: psk.dependency-profile/1.0
    fields:
      - {name: schema, type: "psk.dependency-profile/1.0"}
      - {name: id, type: ObjectId}
      - {name: sources, type: "[SourceRef]", note: "Daten, Modell, Prompt, Sonde, Kalibrierung"}
      - {name: witness_matrix, type: Matrix, note: W}
      - {name: dependency_matrix, type: Matrix, note: D}
      - {name: effective_rank, type: Decimal, note: "r_eff = RankEff(W, D)"}
      - {name: method, type: RankMethodId, note: "deklarierte Schaetzmethode"}
      - {name: quotient_classes, type: "[[ObjectId]]", note: "F / ~_D"}
      - {name: consensus_scope, type: "local | cluster | system | external"}

  - id: OBJ-SEA
    name: SeamReport
    struktur: "7.23"
    fields:
