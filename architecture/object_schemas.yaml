      - {name: overlap, type: "[ObjectId, ObjectId]"}
      - {name: restriction_digest_a, type: Digest}
      - {name: restriction_digest_b, type: Digest}
      - {name: compatible, type: bool}
      - {name: tolerance_class, type: "exact | declared_equivalence"}
      - {name: cell_refs, type: "[M13Address]"}

  - id: OBJ-OBS
