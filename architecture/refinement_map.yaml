schema: psk.refinement-map/1.0
# Vertrag 23.4: Die Referenzimplementierung MUSS fuer jeden konkreten
# Zustandsautomaten eine explizite, maschinenlesbare Abbildung in den
# abstrakten Automaten aus Kapitel 13 dokumentieren. Unabgebildete
# Transitionen sind blocking (I-ARCH-013, PO-REF-001, R-RA-010, T-REF-001).
#
# In Phase I0 existiert noch kein konkreter Automat. Die Datei traegt
# deshalb die vollstaendige Zielstruktur und eine leere Abbildungsmenge.
# Sie wird ab I1 mit jedem realisierten Automaten gefuellt; die
# Deckungsrechnung unten ist die Pruefgroesse von T-REF-001.

abstract_machines: [runtime, object, thought, effect, field, capsule, token]
abstract_source: constitution/state_machines.yaml

simulation_direction: forward          # Definition 23.3, konservative Verfeinerung
preserved_by_abstraction_map: [gate, closure, trace, replay, identity, residue]

mappings: []
# Eintragsform ab I1:
#   - concrete: {module: M__, machine: <name>, from: <state>, to: <state>,
#                operator: <fn>}
#     abstract: {machine: <abstract>, from: <state>, to: <state>,
#                gate: <G-*|null>}

coverage:
  concrete_transitions: 0
  mapped: 0
  unmapped: 0
  complete: false                      # wird true, sobald concrete_transitions > 0 UND unmapped == 0.
                                        # Bei 0 konkreten Transitionen ist "0 unmapped" nur vakuos wahr,
                                        # nicht abgeschlossen (siehe tools/verify-refinement).
unmapped_is_blocking: true
