schema: psk.operator-registry/1.0
source:
  document: CPSK_Konstitutioneller_Maschinenvertrag.md
  state_machine_register: "Kapitel D — State-Machine-Register, Zeilen 1573-1688"
  lifecycle_chapters: "Kapitel 31 Thought-Lifecycle-Automat / 32 Effekt-Lifecycle-Automat / 33 Facettenmorphogenese, Zeilen 691-719"
  note: >
    Jeder Eintrag stammt aus einer tatsaechlichen 'operator:'-Transition in Kapitel D.
    Kapitel 31-33 nennen keine Operator-Bezeichner woertlich (nur Zustandsnamen, die
    Draft->...->Actualized-Kette und die Aktivierungsanforderungen); die Zuordnung
    thought/effect/field <-> Kapitel 31/32/33 ist ueber Zustandsnamen- und
    Anforderungs-Uebereinstimmung verifiziert (siehe notes unten).
count: 23
unique_operator_names: 22
