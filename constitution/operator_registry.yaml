contract: every_operator_traces_to_an_actual_operator_transition_in_anhang_d_state_machine_register

notes:
  - >
    'reconcile' kommt im Quelltext zweimal als Operator vor: thought.OBSERVED->ACTUALIZED
    (Zeile 1611, gate G-ACTUALIZATION) und effect.RECORDED->RECONCILED (Zeile 1643,
    kein Gate). Beide sind als eigene Eintraege belassen, weil beides real vorkommende,
    verschiedene Transitionen in verschiedenen Automaten sind -> 23 Eintraege bei
    22 eindeutigen Operator-Namen.
  - >
    'gate' ist nur fuer die thought-Maschine gefuellt, weil dort explizite 'gate:'-Schluessel
    im Text stehen. Fuer effect und field liefert Kapitel D keine Gate-Angabe (degradierte
    Tripel-Form ohne gate-Feld); Kapitel 46 (Gatefamilie, Zeilen 1061-1074) listet andere,
    nicht 1:1 zuordenbare Gates (G-BOOT, G-LAWFUL, G-REACHABLE, G-CONSTRUCTIBLE, G-CONSENSUS,
    G-RELEASE) und wurde deshalb NICHT zum Auffuellen benutzt.
  - >
    Das bereits im Projekt vorhandene constitution/state_machines.yaml (schema
    psk.state-machines/1.1) enthaelt fuer effect/field zusaetzliche Gates (z. B. G-EFFECT
    fuer gate_plan/issue_token, G-MORPH fuer propose_split/propose_merge/fold/activate)
    sowie zusaetzliche Transitionen/Maschinen (runtime, object, capsule, token;
    lose_receipt, independent_observe, reactivate, ...), die im CPSK-Quelltext (schema
    psk.state-machines/1.0, Kapitel D) nicht vorkommen. Das sind spaetere Verfeinerungen
    dieses Projekts, keine CPSK-Textbelege - sie wurden bewusst NICHT uebernommen.
  - >
    Kapitel 31-33 (Zeilen 691-719) nennen keine Operator-Bezeichner woertlich. Die
    Zuordnung Automat<->Maschine ist ueber Zustands- und Anforderungslisten verifiziert:
    Kapitel 31 zaehlt exakt die thought-Zustaende auf (Specified/Possible/Simulated/
    Selected/Attempted/Observed/Actualized/Residue) und dieselben vier verbotenen
    Kurzschluesse wie Kapitel D 'forbidden' (Zeilen 1622-1625); Kapitel 32 nennt die
    effect-Kette Draft->Gated->Tokenized->Attempted->Recorded->Reconciled->Actualized
    identisch zur Transitionsfolge in Kapitel D und erwaehnt eine "Kompensationsoperation"
    (Zeile 705), die dem 'compensate'-Operator entspricht; Kapitel 33 nennt "Quieszenz"
    (Zeile 717, = QUIESCENT/quiesce) und die Vertrag-33.2-Anforderungsliste (Scope, Linse,
    Operatoren, Evidenzregeln, Dependencyprofil, Budget, Testplan, Rollback, Lineage,
    Zeilen 715f.), die sich in Kapitel D's field.activation_requirements
    (Zeilen 1681-1687) wiederfindet.
  - >
    Der im Auftrag erwaehnte Hinweis "zu 'state_machines_shared' im selben Dokument"
    wurde per Volltextsuche (grep -i "shared") im CPSK-Dokument NICHT gefunden - es
    gibt keinen Abschnitt und keinen Schluessel dieses Namens im Text. Diese Referenz
    wird hier als nicht verifizierbar gemeldet statt stillschweigend uebernommen.
  - >
    Smart-Quote-Artefakt im Quelltext: 'from: '*'' wird an vier Stellen (Zeilen 1613,
    1617, 1650, 1678) als 'from: '*'' mit typografischem Anfuehrungszeichen gerendert
    (Konvertierungsartefakt). Hier normalisiert zum literalen String "*" (Wildcard
    "jeder Zustand"), konsistent mit dessen Verwendung in allen drei Maschinen.
  - >
    Die Operator-Hypothese aus dem Auftrag (22 Namen) wurde vollstaendig gegen Kapitel D
    verifiziert: alle 22 genannten Namen kommen tatsaechlich als 'operator:'-Wert in
    genau einer (bei reconcile: zwei) Transition(en) vor; es gibt in Kapitel D keine
    weiteren, in der Hypothese fehlenden Operatoren.
