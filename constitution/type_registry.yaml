schema: psk.type-registry/1.0
count: 8

# Abgeleitet aus CPSK_Konstitutioneller_Maschinenvertrag.md, Teil II
# (Kapitel 5-13, Zeilen 311-429) und Kapitel 30 (Zeilen 685-687).
#
# Methodik: jede Tupelposition wird einzeln benannt (id/symbol + meaning).
# Wo der Fliesstext eine Position nicht in einem erklaerenden Satz auffuehrt,
# steht bei meaning nur der Symbolname selbst und unexplained: true -
# es wurde keine Bedeutung erfunden. Jeder Typ zitiert seine Quellstelle
# (Definition/Invariante X.Y, Kapitel N) im Kommentar direkt ueber dem Eintrag.

types:

  # Definition 5.1 (Maschinenkonstitution), Kapitel 5, Zeile 313-316:
  # "Die ausfuehrbare Konstitution ist das Tupel CPSK = (I, T, S, O, G, V, P, E, B, R, L, A),
  #  mit Identitaet I, Typregister T, Schemas S, Operatorregister O, Gates G,
  #  Invarianten V, Proof Obligations P, Fehlerordnung E, Capability- und
  #  Boundaryvertrag B, Releasevertrag R, Lock/Manifest L und Artefaktregister A."
  - id: TY-CPSK
    name: CPSK
    tuple: "CPSK = (I, T, S, O, G, V, P, E, B, R, L, A)"
    source: "Definition 5.1 (Maschinenkonstitution), Kapitel 5"
    fields:
      - {symbol: I, meaning: Identitaet, unexplained: false}
      - {symbol: T, meaning: Typregister, unexplained: false}
      - {symbol: S, meaning: Schemas, unexplained: false}
      - {symbol: O, meaning: Operatorregister, unexplained: false}
      - {symbol: G, meaning: Gates, unexplained: false}
      - {symbol: V, meaning: Invarianten, unexplained: false}
      - {symbol: P, meaning: "Proof Obligations", unexplained: false}
      - {symbol: E, meaning: Fehlerordnung, unexplained: false}
      - {symbol: B, meaning: "Capability- und Boundaryvertrag", unexplained: false}
      - {symbol: R, meaning: Releasevertrag, unexplained: false}
      - {symbol: L, meaning: "Lock/Manifest", unexplained: false}
      - {symbol: A, meaning: Artefaktregister, unexplained: false}

  # Definition 5.2 (Maschinenzustand), Kapitel 5, Zeile 317-319:
  # "Ein Laufzustand ist Sigma_t = (C, I, At, Tt, Ft, Ht, Wt, Qt, Et, Lt, Rt),
  #  wobei I die Implementierungsbindung, At den Anker, Tt Gedankenkoerper,
  #  Ft Feldregister, Ht Realitaetshorizont, Wt Witnesses, Qt Gates und Tokens,
  #  Et Effekte, Lt Trace/Replay und Rt Residuen bezeichnet."
  # C wird im Fliesstext nur als Tupelposition genannt, aber im "wobei"-Satz
  # nicht erklaert -> unexplained: true.
  - id: TY-SIGT
    name: Sigma_t
    tuple: "Sigma_t = (C, I, At, Tt, Ft, Ht, Wt, Qt, Et, Lt, Rt)"
    source: "Definition 5.2 (Maschinenzustand), Kapitel 5"
    fields:
      - {symbol: C, meaning: C, unexplained: true}
      - {symbol: I, meaning: Implementierungsbindung, unexplained: false}
      - {symbol: At, meaning: Anker, unexplained: false}
      - {symbol: Tt, meaning: Gedankenkoerper, unexplained: false}
      - {symbol: Ft, meaning: Feldregister, unexplained: false}
      - {symbol: Ht, meaning: Realitaetshorizont, unexplained: false}
      - {symbol: Wt, meaning: Witnesses, unexplained: false}
      - {symbol: Qt, meaning: "Gates und Tokens", unexplained: false}
      - {symbol: Et, meaning: Effekte, unexplained: false}
      - {symbol: Lt, meaning: "Trace/Replay", unexplained: false}
      - {symbol: Rt, meaning: Residuen, unexplained: false}

  # Definition 6.2 (Maschinenzertifikat), Kapitel 6, Zeile 329-332:
  # "Certt = (IC, IM, It, Ct, Gt, Lt, Rt, sigma_t), mit Konformitaetsklasse Ct,
  #  Gatebericht Gt, Trace- und Replaybindung Lt, Residuenbericht Rt und Signatur sigma_t."
  # IC, IM, It sind nicht in Definition 6.2 selbst erklaert, sondern zuvor in
  # Abschnitt 6.1 (Zeile 326) formal gebunden: "IC = H(Can(C)), IM = H(Code,
  # Schemas, Compiler, Profil), It = H(Can(Sigma_t))" und in Invariante 6.1
  # (Zeile 327-328) als "Konstitutions-ID, Implementierungs-ID, ... und
  # Zustands-ID" benannt.
  - id: TY-CERT
    name: Certt
    tuple: "Certt = (IC, IM, It, Ct, Gt, Lt, Rt, sigma_t)"
    source: "Definition 6.2 (Maschinenzertifikat), Kapitel 6; IC/IM/It aus Abschnitt 6.1 und Invariante 6.1"
    fields:
      - {symbol: IC, meaning: "Konstitutions-ID (IC = H(Can(C)))", unexplained: false}
      - {symbol: IM, meaning: "Implementierungs-ID (IM = H(Code, Schemas, Compiler, Profil))", unexplained: false}
      - {symbol: It, meaning: "Zustands-ID (It = H(Can(Sigma_t)))", unexplained: false}
      - {symbol: Ct, meaning: Konformitaetsklasse, unexplained: false}
      - {symbol: Gt, meaning: Gatebericht, unexplained: false}
      - {symbol: Lt, meaning: "Trace- und Replaybindung", unexplained: false}
      - {symbol: Rt, meaning: Residuenbericht, unexplained: false}
      - {symbol: sigma_t, meaning: Signatur, unexplained: false}

  # Definition 7.1 (AnchorSnapshot), Kapitel 7, Zeile 338-341:
  # "Ein Anker ist ein endlicher, bezeugter Kontaktkoerper
  #  At = (Yt, Provt, Sigma_t, Ct, tau_i, tau_e, d_t, dt), der Beobachtungen,
  #  Provenienz, Unsicherheit, Kontext, intrinsische und extrinsische Zeit,
  #  Boundary und Digest bindet."
  - id: TY-ANC
    name: AnchorSnapshot
    tuple: "At = (Yt, Provt, Sigma_t, Ct, tau_i, tau_e, d_t, dt)"
    source: "Definition 7.1 (AnchorSnapshot), Kapitel 7"
    fields:
      - {symbol: Yt, meaning: Beobachtungen, unexplained: false}
      - {symbol: Provt, meaning: Provenienz, unexplained: false}
      - {symbol: Sigma_t, meaning: Unsicherheit, unexplained: false}
      - {symbol: Ct, meaning: Kontext, unexplained: false}
      - {symbol: tau_i, meaning: "intrinsische Zeit", unexplained: false}
      - {symbol: tau_e, meaning: "extrinsische Zeit", unexplained: false}
      - {symbol: d_t, meaning: Boundary, unexplained: false}
      - {symbol: dt, meaning: Digest, unexplained: false}

  # Definition 9.1 (ThoughtBody), Kapitel 9, Zeile 367-370:
  # "Ein Gedankenkoerper ist T = (id, A, chi, M, Gamma, rho, phi, W, U, L, V, G, Tr),
  #  mit Anker A, Claim chi, Modellfamilie M, Trajektorien Gamma, Realitaetsstatus
  #  rho, Faktizitaet phi, Witnesses W, Unsicherheit U, Folgen L, Validierungsplan V,
  #  Gate G und Trace Tr."
  # "id" wird als Tupelposition genannt, aber im "mit"-Satz nicht erklaert ->
  # unexplained: true.
  - id: TY-TB
    name: ThoughtBody
    tuple: "T = (id, A, chi, M, Gamma, rho, phi, W, U, L, V, G, Tr)"
    source: "Definition 9.1 (ThoughtBody), Kapitel 9"
    fields:
      - {symbol: id, meaning: id, unexplained: true}
      - {symbol: A, meaning: Anker, unexplained: false}
      - {symbol: chi, meaning: Claim, unexplained: false}
      - {symbol: M, meaning: Modellfamilie, unexplained: false}
      - {symbol: Gamma, meaning: Trajektorien, unexplained: false}
      - {symbol: rho, meaning: Realitaetsstatus, unexplained: false}
      - {symbol: phi, meaning: Faktizitaet, unexplained: false}
      - {symbol: W, meaning: Witnesses, unexplained: false}
      - {symbol: U, meaning: Unsicherheit, unexplained: false}
      - {symbol: L, meaning: Folgen, unexplained: false}
      - {symbol: V, meaning: Validierungsplan, unexplained: false}
      - {symbol: G, meaning: Gate, unexplained: false}
      - {symbol: Tr, meaning: Trace, unexplained: false}

  # Definition 10.1 (FieldIdentity), Kapitel 10, Zeile 381-384:
  # "Eine operative Feldidentitaet ist Fλ = (Dλ, Πλ, Oλ, Qλ, Wλ, Bλ, Gλ, Θλ, Linλ, Sλ).
  #  Sie bestimmt Domaene, Projektion, Operatoren, Fragen, Witnessregeln, Grenzen,
  #  Gates, Zeitfenster, Lineage und Lebenszyklus."
  # Πλ zusaetzlich in Definition 10.3 (Spektrallinse), Zeile 388-390: "Eine
  # Spektrallinse Πλ ist ein typisierter Projektor auf einen Ausschnitt des
  # ankerrelativen Welt- oder Moeglichkeitskoerpers."
  - id: TY-FLD
    name: FieldIdentity
    tuple: "F_lambda = (D_lambda, Pi_lambda, O_lambda, Q_lambda, W_lambda, B_lambda, G_lambda, Theta_lambda, Lin_lambda, S_lambda)"
    source: "Definition 10.1 (FieldIdentity), Kapitel 10; Pi_lambda zusaetzlich Definition 10.3 (Spektrallinse)"
    fields:
      - {symbol: D_lambda, meaning: Domaene, unexplained: false}
      - {symbol: Pi_lambda, meaning: "Projektion (Spektrallinse: typisierter Projektor auf einen Ausschnitt des ankerrelativen Welt- oder Moeglichkeitskoerpers, Definition 10.3)", unexplained: false}
      - {symbol: O_lambda, meaning: Operatoren, unexplained: false}
      - {symbol: Q_lambda, meaning: Fragen, unexplained: false}
      - {symbol: W_lambda, meaning: Witnessregeln, unexplained: false}
      - {symbol: B_lambda, meaning: Grenzen, unexplained: false}
      - {symbol: G_lambda, meaning: Gates, unexplained: false}
      - {symbol: Theta_lambda, meaning: Zeitfenster, unexplained: false}
      - {symbol: Lin_lambda, meaning: Lineage, unexplained: false}
      - {symbol: S_lambda, meaning: Lebenszyklus, unexplained: false}

  # Definition 12.1 (Evidence Object), Kapitel 12, Zeile 408-410:
  # "Ein Evidence Object ist E = (type, scope, input, output, method, trace,
  #  hash, signature, status). Evidence ist eine pruefbare Grundlage, nicht
  #  automatisch Wahrheit."
  # Der Folgesatz erklaert den Typ als Ganzes (Evidence = pruefbare Grundlage),
  # aber keine einzelne Tupelposition -> alle Felder unexplained: true.
  - id: TY-EVO
    name: EvidenceObject
    tuple: "E = (type, scope, input, output, method, trace, hash, signature, status)"
    source: "Definition 12.1 (Evidence Object), Kapitel 12"
    fields:
      - {symbol: type, meaning: type, unexplained: true}
      - {symbol: scope, meaning: scope, unexplained: true}
      - {symbol: input, meaning: input, unexplained: true}
      - {symbol: output, meaning: output, unexplained: true}
      - {symbol: method, meaning: method, unexplained: true}
      - {symbol: trace, meaning: trace, unexplained: true}
      - {symbol: hash, meaning: hash, unexplained: true}
      - {symbol: signature, meaning: signature, unexplained: true}
      - {symbol: status, meaning: status, unexplained: true}

  # Definition 30.2 (Nachrichtenhuelle), Kapitel 30, Zeile 685-687:
  # "Msg = (msg_id, type, schema_id, producer, consumer, run_id, input_digests,
  #  created_at, trace_parent, payload_digest, signature)."
  # Kein "mit/wobei"-Satz folgt der Definition; die vorangehende Zeile 682
  # beschreibt Modulgrenzen allgemein (Eingabeschema, Ausgabeschema,
  # Identitaetsbindung, Fehlersemantik, Capabilityanforderung, Tracepflicht),
  # ordnet dies aber keiner einzelnen Msg-Tupelposition zu -> alle Felder
  # unexplained: true.
  - id: TY-MSG
    name: Msg
    tuple: "Msg = (msg_id, type, schema_id, producer, consumer, run_id, input_digests, created_at, trace_parent, payload_digest, signature)"
    source: "Definition 30.2 (Nachrichtenhuelle), Kapitel 30"
    fields:
      - {symbol: msg_id, meaning: msg_id, unexplained: true}
      - {symbol: type, meaning: type, unexplained: true}
      - {symbol: schema_id, meaning: schema_id, unexplained: true}
      - {symbol: producer, meaning: producer, unexplained: true}
      - {symbol: consumer, meaning: consumer, unexplained: true}
      - {symbol: run_id, meaning: run_id, unexplained: true}
      - {symbol: input_digests, meaning: input_digests, unexplained: true}
      - {symbol: created_at, meaning: created_at, unexplained: true}
      - {symbol: trace_parent, meaning: trace_parent, unexplained: true}
      - {symbol: payload_digest, meaning: payload_digest, unexplained: true}
      - {symbol: signature, meaning: signature, unexplained: true}

stats:
  types_total: 8
  fields_total: 82
  fields_explained: 60
  fields_unexplained: 22
  unexplained_by_type:
    CPSK: 0
    Sigma_t: 1        # C
    Certt: 0
    AnchorSnapshot: 0
    ThoughtBody: 1    # id
    FieldIdentity: 0
    EvidenceObject: 9 # type, scope, input, output, method, trace, hash, signature, status
    Msg: 11           # alle Felder - kein erklaerender Satz im Quelltext
