# Quelle: CPSK_Konstitutioneller_Maschinenvertrag.md
# - Datei-/Verzeichnisliste: Kapitel 41 "Bundle-Struktur", Zeilen 803-831
#   (Listing 41.1 "Kanonische Bundle-Struktur", Zeilen 805-828, unter
#   psk-constitution/; Vertrag 41.1, Zeilen 829-831).
# - Rang/Funktion je Artefakt: Zeilen 88-98, Tabelle "Artefakt Rang Funktion"
#   im Abschnitt "Dokumenten- und Artefaktstatus".
#
# Listing 41.1 fuehrt 22 Eintraege unter psk-constitution/ (die Zeile
# "psk-constitution/" selbst zaehlt als Wurzel nicht mit). Das deckt sich mit
# architecture/obligations.yaml OBL-009 ("fuer alle 22 gemeinsamen
# Dateinamen") und mit constitution/constitution.lock.json
# (declared_ancestor_constitution_id.evidence.conflicting_files: 22).
#
# Die Rang-Werte sind woertlich aus der Tabelle uebernommen: "Identitätswurzel",
# "normativ", "normative Projektion", "Referenzwerkzeug". Ein Rang "informativ"
# kommt im Quelltext NICHT vor und wird hier deshalb nicht verwendet.
#
# Die Tabelle nennt nur 7 Kategorien fuer 22 Dateien/Verzeichnisse. Wo ein
# Eintrag woertlich in einer Tabellenzeile genannt ist (constitution.lock.json;
# constitution.yaml; "Typen, Schemata, Automaten"; "Invarianten und Gates";
# "Proof Obligations und Tests"; "Verifier und Golden Run"), steht
# zuordnung: explizit. Wo ein Eintrag keiner Zeile woertlich entspricht, aber
# laut Definition 40.2 (Kapitel 40) zur Menge der "normativen Dateien" gehoert,
# aus denen die Konstitutions-ID gebildet wird - bestaetigt durch das bereits
# vorliegende constitution/constitution.lock.json (Feld normative_files) und
# constitution/constitution.yaml (Feld normative_precedence) -, steht
# zuordnung: abgeleitet. Fuer MANIFEST.sha256 nennt die Tabelle keine
# Kategorie; rang bleibt dort bewusst null statt erfunden.
#
# present_in_repo ist keine CPSK-Aussage, sondern eine Bestandspruefung dieses
# Repos zum Schreibzeitpunkt (2026-08-03). schemas/, tools/verify_bundle.py
# und golden/golden_run.json stehen im Register, sind aber - analog zu
# architecture/schemas/ und den WP-Verweisen in VERSIONING.md,
# constitution.lock.json (normative_files_note) und tools/verify-bundle/ -
# noch nicht angelegt.
schema: psk.artifact-registry/1.0
count: 22
root: psk-constitution/
rang_definitionen:
  - rang: Identitätswurzel
    funktion: "Bindet Konstitutions-ID und kanonische Digests."
    beleg: "Zeile 89-90"
  - rang: normativ
    funktion: "Legt Axiome, Bootpolitik, Amendment-Regeln, zulaessige Maschinenzustaende
      und Uebergaenge, Commit-/Wirkungs-/Faktpromotionsgrenzen sowie die erforderlichen
      Nachweisformen fest."
    beleg: "Zeile 91-96 (vier Tabellenzeilen mit identischem Rang 'normativ', je
      eigener Funktion: constitution.yaml; Typen/Schemata/Automaten; Invarianten
      und Gates; Proof Obligations und Tests)"
  - rang: normative Projektion
    funktion: "Menschlich lesbare Verfassung und Container des Bundles."
    beleg: "Zeile 97"
    hinweis: "Betrifft das PDF. Laut Vertrag 41.1 traegt das PDF das Bundle als
      eingebettete Anlage, ist selbst aber kein Eintrag von Listing 41.1 - daher
      kein files-Eintrag mit diesem Rang in dieser Datei."
  - rang: Referenzwerkzeug
    funktion: "Pruefen eine konkrete Bundle-Instanz; definieren nicht allein die
      Semantik."
    beleg: "Zeile 98"
