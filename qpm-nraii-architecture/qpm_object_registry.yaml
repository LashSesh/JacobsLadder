# Quelle: PSK_QPM_NRAII_Referenzarchitektur_v1.0.1.pdf, Listing A.1
# (Kapitel A "QPM-Objekt- und Sortenbindung"). Woertlich uebernommen;
# die Kommentarzeilen unter QPM-OCW stehen so im Werk.
#
# WARUM NICHT UNTER architecture/: das Werk fuehrt eigenstaendige
# Identitaeten (Symbolregister: "I_QPM, I_NRAII - Eigenstaendige
# Identitaeten von QPM-RA und NRAII-RA"), und das Nahtregister fuehrt
# "shared-identity-in-certificate" als blockierenden Negativtest. Diese
# Register duerfen deshalb NICHT in I_A eingehen - laegen sie unter
# architecture/, taeten sie es. Das Werk benennt die Verzeichnisse selbst
# so (qpm-nraii-architecture/, nraii-architecture/); die Trennung ist
# damit dokumentiert, nicht gewaehlt. Dieselbe Ueberlegung wie beim
# DomainProfile unter domains/.
#
# binds_to zeigt auf das PSK-RA-Register, dessen Sorten hier belegt
# werden: additiv, ohne neue Primaersorte (no_new_primary_sort: true).
# Invariante 5.2 (Sortenabschluss) bleibt damit unberuehrt.

schema: psk.qpm.object-registry/1.0
binds_to: architecture/object_registry.yaml # PSK-RA, additiv, keine neue Primaersort
