[package]
name = "psk-lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
psk-types = { path = "../psk-types" }
psk-ipc = { path = "../psk-ipc" }

# OBL-010 (getrennte Benutzerkontexte oder Namespaces): die reale
# Substraterzwingung (sandbox.rs) ist unvermeidlich plattformspezifisch
# (Regel Einzelrechnerbetrieb selbst verlangt das "plattform- und
# domaenenabhaengig zu deklarieren"). Nur unter Windows eingebunden, damit
# ein (derzeit hypothetischer) Nicht-Windows-Build nicht an einer fuer ihn
# irrelevanten Abhaengigkeit scheitert - siehe sandbox.rs' Kopfkommentar
# fuer die Windows-Wahl selbst.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Console"] }

[dev-dependencies]
# Nur fuer tests/spawn_and_request.rs (Anfrage-/Antworttypen) -
# psk-lifecycle selbst haengt zur Laufzeit NICHT von den Adaptercrates
# ab; `spawn` nimmt jeden Pfad entgegen (siehe `sibling_binary_path`,
# das die realen Binaries im Cargo-Ausgabeverzeichnis findet, ohne einen
# Cargo-Abhaengigkeitsgraphen zu ihnen zu brauchen).
psk-effect = { path = "../psk-effect" }
psk-anchor = { path = "../psk-anchor" }
serde_json = "1"

[build-dependencies]
psk-codegen = { path = "../../tools/psk-codegen" }
