[package]
name = "psk-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
psk-types = { path = "../psk-types" }
psk-canon = { path = "../psk-canon" }
psk-anchor = { path = "../psk-anchor" }
psk-thought = { path = "../psk-thought" }
psk-fields = { path = "../psk-fields" }
psk-dependency = { path = "../psk-dependency" }
psk-adversarial = { path = "../psk-adversarial" }
psk-closure = { path = "../psk-closure" }
# M22/M23: Zellclosure und IRBundle-Zusammenbau sind Compile-/Verify-
# Phasenarbeit (Definition 14.2) und laufen seit der Taktumverdrahtung
# durch dispatch. psk-scheduler ist Orchestrator (verify-dependencies,
# is_orchestrator): die Taktschleife ruft modulueberschreitend in bereits
# vorhandene, einzeln getestete Funktionen - keine Portumgehung.
psk-ir = { path = "../psk-ir" }
psk-topology = { path = "../psk-topology" }
psk-witness = { path = "../psk-witness" }
psk-gate = { path = "../psk-gate" }
psk-effect = { path = "../psk-effect" }
psk-reconciliation = { path = "../psk-reconciliation" }
psk-trace = { path = "../psk-trace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
psk-codegen = { path = "../../tools/psk-codegen" }